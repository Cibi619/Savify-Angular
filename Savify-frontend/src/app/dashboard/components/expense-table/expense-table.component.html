<table class="expense-table">
  <thead>
    <tr>
      <th>Category</th>
      <th>Name</th>
      <th>Date</th>
      <th>Amount</th>
      <th>Note</th>
    </tr>
  </thead>

  <tbody>
    @for (item of expenses; track item) {
      <tr>
        <td>{{ item.category }}</td>
        <td>{{ item.name }}</td>
        <td>{{ item.date | date: 'dd/MM/yyyy' }}</td>
        <td>{{ item.price }}</td>
        <td>{{ item.note }}</td>
      </tr>
    }
  </tbody>
</table>
